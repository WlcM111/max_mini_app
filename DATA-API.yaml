# Проверки собственного API решения «Вовремя». Схема файла — пункты 1–9 раздела «Для решений с собственным API» кейса.
# Обязательные проверки — checks; additional_checks — дополнительные (см. комментарий перед разделом).
# Имена параметров пути совпадают с openapi.yaml. Служебные поля для scripts/run_data_api_checks.py:
# capture — значение из ответа для следующих проверок (подставляется в path),
# response.signature — первые байты файла в ответе.
schema_version: "1.0"                       # 1. версия конфигурации
solution:                                   # 2. наименование решения и команда
  name: "Вовремя"
  team_id: "vovremya"
base_url: "https://maxminiapp.race-src.com/api/v1"   # 3. базовый адрес API боевого стенда
auth:
  scheme: bearer
  header: Authorization
  roles:
    editor: "токен учётной записи reviewer_editor (первый слайд презентации)"
    viewer: "токен учётной записи reviewer_viewer (первый слайд презентации)"
    anonymous: "без заголовка Authorization"
fixtures:                                   # тестовые данные seed-demo (demo/demo-data.json)
  organizationId: "0b6f2c1e-5a3d-4c8e-9f21-7d4a6b8c9e01"
  documentId: "3c9e7a52-1f4b-4d6a-8e2c-5b7f9a1d3e02"
checks:                                     # 4. обязательные проверки основной функциональности
  - id: me
    description: Профиль и членства текущего пользователя
    method: GET                             # 5. метод и относительный путь
    path: /me
    params: {path: {}, query: {}, headers: {}, body: null}   # 6. параметры запроса
    role: viewer                            # 7. роль
    expected_status: [200]                  # 8. статус-коды
    response:                               # 9. формат ответа
      content_type: application/json
      schema: "openapi.yaml#/components/schemas/Me"
      required_fields: [account.id, memberships, reminders_channel.state, limits.max_documents_per_organization]
  - id: catalog
    description: Справочник типов документов и видов деятельности
    method: GET
    path: /catalog
    params: {path: {}, query: {}, headers: {}, body: null}
    role: viewer
    expected_status: [200]
    response:
      content_type: application/json
      schema: "openapi.yaml#/components/schemas/Catalog"
      required_fields: [document_types, business_categories, regions, features]
  - id: organization
    description: Организация со сводкой по статусам сроков
    method: GET
    path: /organizations/{organizationId}
    params: {path: {organizationId: fixture}, query: {}, headers: {}, body: null}
    role: viewer
    expected_status: [200]
    response:
      content_type: application/json
      schema: "openapi.yaml#/components/schemas/Organization"
      required_fields: [id, name, my_role, stats.expired, stats.expiring, stats.valid, version]
  - id: suggestions
    description: Подбор типовых документов по профилю
    method: GET
    path: /organizations/{organizationId}/suggestions
    params: {path: {organizationId: fixture}, query: {}, headers: {}, body: null}
    role: viewer
    expected_status: [200]
    response:
      content_type: application/json
      schema: "openapi.yaml#/components/schemas/SuggestionList"
      required_fields: [items]
  - id: documents-expiring
    description: Реестр документов, фильтр «скоро истекает»
    method: GET
    path: /organizations/{organizationId}/documents
    params: {path: {organizationId: fixture}, query: {status: expiring, limit: "20"}, headers: {}, body: null}
    role: viewer
    expected_status: [200]
    response:
      content_type: application/json
      schema: "openapi.yaml#/components/schemas/DocumentPage"
      required_fields: [items, "items[].id", "items[].title", "items[].status", "items[].days_left"]
  - id: document
    description: Карточка документа
    method: GET
    path: /documents/{documentId}
    params: {path: {documentId: fixture}, query: {}, headers: {}, body: null}
    role: viewer
    expected_status: [200]
    response:
      content_type: application/json
      schema: "openapi.yaml#/components/schemas/Document"
      required_fields: [id, title, status, current_period.valid_until, reminder_offsets_days, periods, can_edit]
  - id: document-create
    description: Создание документа (повтор с тем же id даёт 200)
    method: POST
    path: /organizations/{organizationId}/documents
    params:
      path: {organizationId: fixture}
      query: {}
      headers: {Content-Type: application/json}
      body: {id: "9d7c6b5a-4e3f-4a2b-8c1d-0e9f8a7b6c51", title: "Проверочный документ (тестовые данные)", valid_until: "2027-01-31", reminder_offsets_days: [30, 7]}
    role: editor
    expected_status: [201, 200]
    response:
      content_type: application/json
      schema: "openapi.yaml#/components/schemas/Document"
      required_fields: [id, title, status, version]
  - id: document-create-forbidden
    description: Роль viewer не может создавать документы
    method: POST
    path: /organizations/{organizationId}/documents
    params:
      path: {organizationId: fixture}
      query: {}
      headers: {Content-Type: application/json}
      body: {id: "1a2b3c4d-5e6f-4a1b-9c2d-3e4f5a6b7c81", title: "Не должен создаться", valid_until: "2027-01-31"}
    role: viewer
    expected_status: [403]
    response:
      content_type: application/problem+json
      schema: "openapi.yaml#/components/schemas/Problem"
      required_fields: [code, status, title]
  - id: unauthenticated
    description: Запрос без токена отклоняется
    method: GET
    path: /me
    params: {path: {}, query: {}, headers: {}, body: null}
    role: anonymous
    expected_status: [401]
    response:
      content_type: application/problem+json
      schema: "openapi.yaml#/components/schemas/Problem"
      required_fields: [code, status]
  - id: documents-batch
    description: "Импорт из Excel: пакет до 30 документов, как его отправляет экран импорта (FR-24); повтор с теми же id дублей не создаёт"
    method: POST
    path: /organizations/{organizationId}/documents/batch
    params:
      path: {organizationId: fixture}
      query: {}
      headers: {Content-Type: application/json}
      body:
        items:
          - {id: "4d3c2b1a-9f8e-4d7c-8b6a-5f4e3d2c1b01", title: "Проверочный договор аренды (тестовые данные)", valid_until: "2027-06-30", reminder_offsets_days: [30, 7]}
          - {id: "4d3c2b1a-9f8e-4d7c-8b6a-5f4e3d2c1b02", title: "Проверочный устав (тестовые данные)", valid_until: null}
    role: editor
    expected_status: [201]
    response:
      content_type: application/json
      schema: "openapi.yaml#/components/schemas/DocumentsBatchResult"
      required_fields: [items, "items[].id", "items[].status"]
  - id: export-create
    description: Временная ссылка на выгрузку сроков (календарь .ics и реестр .xlsx)
    method: POST
    path: /organizations/{organizationId}/exports/calendar
    params: {path: {organizationId: fixture}, query: {}, headers: {}, body: null}
    role: viewer
    expected_status: [201]
    response:
      content_type: application/json
      schema: "openapi.yaml#/components/schemas/CalendarExport"
      required_fields: [download_url, file_name, expires_at]
    capture:
      downloadToken: {field: download_url, pattern: "/downloads/([A-Za-z0-9_-]{43})"}
# Дополнительные проверки: не входят в перечень обязательных. Зависят от внешнего сервиса GigaChat
# (ключ, суточный бюджет токенов, ответ модели) или от значения из предыдущей проверки (capture).
additional_checks:
  - id: document-draft
    description: "Ассистент: черновик карточки по тексту (FR-21); на стенде ключ GigaChat подключён, без ключа — 503"
    method: POST
    path: /organizations/{organizationId}/documents/draft
    params:
      path: {organizationId: fixture}
      query: {}
      headers: {Content-Type: application/json}
      body: {text: "Лицензия на розничную продажу алкогольной продукции № 78РПА0012345, выдана 14.03.2024, действует до 13.03.2029 (тестовые данные)"}
    role: editor
    expected_status: [200]
    response:
      content_type: application/json
      schema: "openapi.yaml#/components/schemas/DocumentDraft"
      required_fields: [title, valid_until, reminder_offsets_days, confidence]
  - id: document-draft-image
    description: "Ассистент: черновик карточки по фото документа (FR-23); снимок синтетический, с тестовыми данными"
    method: POST
    path: /organizations/{organizationId}/documents/draft-image
    params:
      path: {organizationId: fixture}
      query: {}
      headers: {Content-Type: application/json}
      body: {mime_type: image/png, image: ""}
    role: editor
    expected_status: [200]
    response:
      content_type: application/json
      schema: "openapi.yaml#/components/schemas/DocumentDraft"
      required_fields: [title, confidence]
  - id: profile-match
    description: "Ассистент: вид деятельности и признаки по описанию бизнеса (FR-22)"
    method: POST
    path: /profile-match
    params:
      path: {}
      query: {}
      headers: {Content-Type: application/json}
      body: {description: "Кофейня на 30 мест в Санкт-Петербурге, есть своё помещение, продаём пиво и вино"}
    role: viewer
    expected_status: [200]
    response:
      content_type: application/json
      schema: "openapi.yaml#/components/schemas/ProfileMatch"
      required_fields: [feature_codes, confidence]
  - id: registry-xlsx
    description: "Реестр в Excel по ссылке из export-create (FR-25), без токена"
    method: GET
    path: /downloads/{downloadToken}
    params: {path: {downloadToken: capture}, query: {format: xlsx}, headers: {}, body: null}
    role: anonymous
    expected_status: [200]
    response:
      content_type: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      signature: PK
