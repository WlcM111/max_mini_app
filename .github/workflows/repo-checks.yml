# Проверки комплектности репозитория на каждый push и pull request: обязательные файлы формата
# сдачи (включая .env.example), согласованность compose и контрактов (BUG-001).
name: repo-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 scripts/check_compose.py
      - run: bash scripts/preflight.sh
